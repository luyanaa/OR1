DESIGN_NAME: counter
VERILOG_FILES: dir::counter.v
CLOCK_PERIOD: 20
CLOCK_PORT: clk
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_TIE_FANOUT: false
CTS_CLK_BUFFERS:
  - BUFX2
RUN_ANTENNA_REPAIR: false
GRT_ANTENNA_REPAIR_ITERS: 0
# OpenROAD's antenna checker crashes (std::vector assertion in
# ant::AntennaChecker::Impl::saveGates) on this LEF, which has no
# ANTENNA* attributes on the cell pins. Skip the post-DRT antenna pass.
DRT_ANTENNA_REPAIR_ITERS: 0
FP_CORE_UTIL: 30
FP_SIZING: absolute
DIE_AREA: [0, 0, 200, 400]
CORE_AREA: [20, 60, 180, 340]
# OpenROAD 26Q3's diamond-search legalizer cannot place the 129-site DFFPOSX1
# once the PDN m2 stripes are painted (every >=129-site run in a row crosses a
# stripe, and checkPixels' blocked_layers rejects it).  Verified: removing the
# special-net wires lets DPL place all 4 cleanly, and marking them FIRM lets
# DPL skip them while the other 17 cells legalise.  Pin all four DFFPOSX1 to
# legal sites on the empty MX rows via Odb.ManualMacroPlacement (--fixed).
RUN_POST_GPL_DESIGN_REPAIR: false
# OR1 cell diffusion is asymmetric (0.5um left inset, 1.0-2.0um right).  OpenROAD's
# optimize_mirroring flips individual cells inside a row for HPWL, and a
# mirrored cell abutting an unmirrored one leaves only 1.0um of DIFF space
# (rule: 1.5).  Keep every cell in its row orientation.
PL_OPTIMIZE_MIRRORING: false
MACRO_PLACEMENT_CFG: dir::macro_placement.cfg
DRT_OPT_ITERS: 10
ERROR_ON_DISCONNECTED_PINS: false
RUN_IRDROP_REPORT: true
DEDUPLICATE_CORNERS: true
# magic's def read paints no routing, so its streamout produces a
# routing-less GDS. KLayout streamout honours the LEF/DEF layer map and
# produces the real routed GDS used by DRC/LVS/XOR.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
KLAYOUT_CONFLICT_RESOLUTION: AddToCell
MAGIC_DEF_LABELS: true
MAGIC_EXT_ABSTRACT_CELLS:
  - "NAND2X1"
  - "BUFX2"
  - "INVX1"
  - "DFFPOSX1"
  - "NOR2X1"
  - "TIEHI"
  - "TIELO"
  - "FILL"
MAGIC_DRC_MAGLEFS:
  - pdk_dir::libs.ref/or1_fd_sc/maglef/BUFX2.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/DFFPOSX1.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/FILL.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/INVX1.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/NAND2X1.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/NOR2X1.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/TIEHI.mag
  - pdk_dir::libs.ref/or1_fd_sc/maglef/TIELO.mag
STA_CORNERS:
  - nom_tt_5P0_25C

# physical-only filler cells carry no devices; flatten them for LVS
LVS_FLATTEN_CELLS: [FILL, TAP, FILL_05, FILL_10, FILL_15, FILL_20, FILL_25]

# --- KLayout sign-off -------------------------------------------------------
# libs.tech/klayout/drc/OR1.drc is the official OR1 rule set (v1.51), ported
# verbatim: no rule value is relaxed and no rule is waived.  The counter runs
# at KLayout DRC = 0 (verified twice: the flow metric and an independent
# `klayout -b -r OR1.drc` on final/gds/counter.gds).
#
# The three library defects that used to keep the deck non-zero were fixed in
# the reference views rather than in the deck:
#
#   * Boundary substrate taps.  Every logic cell carried n/p substrate taps
#     whose diff/implant/metal reached the top and bottom cell edges, so at the
#     30 um row pitch the tap of one row landed on the flipped tap of the
#     next (DIFF/dcont space, nsubcont overlap, NWL space/width).  The taps
#     were removed from the logic cells; the dedicated TAP/FILL/ENDCAP cells
#     provide the well and substrate contacts, and LVS still matches the
#     substrate nodes uniquely.
#
#   * DFFPOSX1/DFFRX1/DFFRX2 view misalignment.  These three cells were
#     widened for the legalizer (55 -> 64.5/84/100 um) by extending the cell
#     to the LEFT of the origin, so the drawn metal sat 11/30.5/46.5 um left of
#     the LEF pins.  Every DFF signal pin was physically disconnected in the
#     streamed layout while the LEF-based flow reported no problem.  The cell
#     geometry was shifted back onto the LEF origin, the LEF pin rectangles
#     were re-derived from the drawn metal, and the M1 rails were extended to
#     the library's +/-0.5 um rail-mate convention (they had stopped 0.5 um
#     short and produced ML1 space < 1.0 at every DFF edge).
#
#   * via1-via2 non-stack.  The DM_via1 marker layer (105) is the via1 drawing
#     marker; the cells drew it as a 2x2 um landing pad around a 1x1 um cut.
#     The rule then flags any router via2 that touches that pad, which
#     TritonRoute cannot avoid.  The markers now coincide with the actual via1
#     cuts (as upstream's rule intent requires); a via2 that really partially
#     overlaps a via1 cut is still flagged.
#
# DIFF space was additionally kept clean by PL_OPTIMIZE_MIRRORING: false (see
# the note next to that variable).
#
# Magic DRC.
#   * The authoritative sign-off deck is KLayout (OR1.drc = official v1.51
#     rules, ported verbatim — no rule relaxed).
#   * Magic's tile model treats every contact/via as a *cut* in the conductor,
#     so its `overhang`/enclosure rules measure the metal fragment beside a cut
#     and can report noise that the official deck has no equivalent for.  That
#     is why it is not the sign-off deck.
#   * It nonetheless reaches 0 now that the `maglef` abstracts carry the
#     current cell outlines and the nwell layer (2026-11-02).  Magic only
#     sees the abstracts for the eight MAGIC_EXT_ABSTRACT_CELLS, so this 0
#     covers the routing/PDN, the full-geometry cells and every cell's
#     pin/rail interface — not the abstracted cells' internals.
ERROR_ON_MAGIC_DRC: true
# KLayout is the sole DRC sign-off deck and it is clean: make any regression a
# hard failure instead of a warning.
ERROR_ON_KLAYOUT_DRC: true

# Verilator lint is a pre-synthesis style checker, not a sign-off step.
# yosys 0.70 (the nix-pinned version here) drops the `if` keyword when it
# re-writes the `always @(posedge CLK or posedge RESET)` models, producing
# syntactically invalid black-box verilog that verilator then rejects.
# The lint errors are an artifact of that tool bug, not of the design or
# the cell models.  Skip it; synthesis timing checks cover the constructs.
RUN_LINTER: false

# Same yosys 0.70 round-trip bug crashes Yosys.JsonHeader: it re-reads the
# functional verilog through `blackbox; write_verilog` and emits `else`
# without a matching `if`.  Give yosys a port-only black-box model for both
# slots: the BB file is the only one yosys needs (port lists for link_design),
# and pointing CELL_VERILOG_MODELS at it keeps the functional or1_fd_sc.v out
# of the blackbox/write_verilog path entirely.
CELL_BB_VERILOG_MODELS:
  - pdk_dir::libs.ref/or1_fd_sc/verilog/or1_fd_sc_bb.v
CELL_VERILOG_MODELS:
  - pdk_dir::libs.ref/or1_fd_sc/verilog/or1_fd_sc_bb.v

# Cut-layer resistance for OpenSTA / IR-drop.  OR1 carries the via resistance
# on the VIA definitions; LEF 5.4 cannot put RESISTANCE on a TYPE CUT layer, so
# the values are handed to set_rc.tcl through librelane's VIAS_R hook.
# 1.0 ohm per cut each (OR1.tlef: VIA M2_M1 / VIA M3_M2 RESISTANCE 1.0).
VIAS_R:
  "*":
    via1:
      res: 1.0
    via2:
      res: 1.0
